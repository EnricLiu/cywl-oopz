[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cywl-oopz"
version = "0.1.0"
description = "An asynchronous OOPZ bot with LLM, music, and voice extension points."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "asyncpg>=0.30.0",
    "ddgs>=9.14.4",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "oopz-sdk>=0.15.0",
    "pydantic-ai-slim[mcp,openai]>=2.18.0",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.0",
    "soxr>=1.0.0",
    "websockets>=15.0.1,<16",
    "yt-dlp[curl-cffi,default]>=2026.6.9",
]

[project.scripts]
cywl-oopz = "cywl_oopz.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["ref", "sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
oopz-sdk = { path = "sdk", editable = true }
